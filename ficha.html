<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha ANP · Áreas Naturales Protegidas de Aguascalientes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="leaf">🌿</span> ANP Aguascalientes</div>
  <nav class="site-nav">
    <a href="index.html">Inicio</a>
    <a href="visor.html">Visor de mapa</a>
  </nav>
</header>

<main id="contenido">
  <p>Cargando ficha...</p>
</main>

<footer class="site-footer">
  Áreas Naturales Protegidas de Aguascalientes · Fuente: capas SIG y decretos oficiales
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/datos.js"></script>
<script>
function campo(valor) {
  if (esTodo(valor) || !valor) {
    return '<span class="aviso-todo">Información pendiente de captura</span>';
  }
  return valor;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const contenido = document.getElementById('contenido');

  const [anps, geojson] = await Promise.all([cargarANPs(), cargarGeoJSON()]);
  const anp = anps.find(a => a.id === id);
  const feature = geojson.features.find(f => f.properties.id === id);

  if (!anp) {
    contenido.innerHTML = '<p>No se encontró esta área natural protegida. <a href="index.html">Volver al listado</a></p>';
    return;
  }

  const nivelTexto = esTodo(anp.nivel) ? 'Por confirmar' : anp.nivel;

  const pdfs = Object.entries(anp.pdfs || {});
  const docsHTML = pdfs.length
    ? `<div class="docs-box">${pdfs.map(([clave, ruta]) =>
        `<a class="doc-link" href="${ruta}" target="_blank" rel="noopener">📄 ${nombreDoc(clave)}</a>`
      ).join('')}</div>`
    : `<div class="aviso-todo">Aún no se han cargado documentos (decreto / programa de manejo) para esta ANP.</div>`;

  contenido.innerHTML = `
    <a class="volver-link" href="index.html">← Volver al listado</a>
    <div class="ficha-header">
      <span class="badge ${nivelBadgeClass(anp.nivel)}">${nivelTexto}</span>
      <h1>${anp.nombre}</h1>
      <div style="color:var(--texto-suave)">${campo(anp.municipios)}</div>
    </div>

    <div class="ficha-grid">
      <div id="fichaMapa" class="ficha-mapa"></div>
      <div class="ficha-datos">
        <dl>
          <dt>Superficie</dt><dd>${formatoHectareas(anp.hectareas)}</dd>
          <dt>Nivel</dt><dd>${campo(anp.nivel)}</dd>
          <dt>Categoría de manejo</dt><dd>${campo(anp.categoria_manejo)}</dd>
          <dt>Municipios</dt><dd>${campo(anp.municipios)}</dd>
          <dt>Fecha de decreto</dt><dd>${campo(anp.fecha_decreto)}</dd>
        </dl>
      </div>
    </div>

    <div class="descripcion-box">
      <h2>Descripción</h2>
      <p>${campo(anp.descripcion)}</p>
    </div>

    <div class="descripcion-box">
      <h2>Documentos oficiales</h2>
      ${docsHTML}
    </div>
  `;

  const map = L.map('fichaMapa', { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  if (feature) {
    const layer = L.geoJSON(feature, {
      style: { color: '#2d6a4f', weight: 2, fillColor: '#52b788', fillOpacity: 0.4 }
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [20, 20] });
  } else {
    map.setView([21.88, -102.3], 9);
  }
}

init();
</script>
</body>
</html>
